services:
  mackie:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist org memory (profiles, ledgers, preferences) and conversation history
      - ./data:/app/data
      # Skills are mounted so a non-engineer can add or edit a platform, content type
      # or format YAML without rebuilding the image
      - ./skills:/app/skills
    restart: unless-stopped
