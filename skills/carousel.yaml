kind: format
id: carousel
name: Carousel
purpose: Teach or tell a story step by step — tips, myths vs facts, a year in review; people save and share them
structure: |
  1. "Slide 1:" a hook that makes people swipe
  2. "Slide 2:" to "Slide 6:" one idea per slide, a short line of on-slide text each
  3. "Last slide:" the call to action
  4. The caption, which adds context instead of repeating the slides
platforms:
  - instagram
  - facebook
  - linkedin
