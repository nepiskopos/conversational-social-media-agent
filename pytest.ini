[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the run, so tests share one database connection pool (a pool belongs
# to its loop, and opening one per test tripled the suite's time).
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
# Opt-in: browser tests (tests/browser, -m browser, ~30 s) drive the real web UI; deployed
# tests (tests/deployed, -m deployed) check a running Docker Compose stack.
addopts = -m "not browser and not deployed"
markers =
    browser: drives the real web UI in headless Chromium (needs playwright)
    deployed: checks a running Docker Compose stack (needs MACKIE_DEPLOYED_PASSWORD)
filterwarnings =
    # Chainlit's tracing dependency, not our code; importing app.py triggers it.
    ignore::DeprecationWarning:traceloop.*
    ignore::pydantic.warnings.PydanticDeprecatedSince20:traceloop.*
    # LiteLLM's response types, raised by pydantic when a test builds litellm.Timeout.
    ignore:Item 'summary' on TypedDict class 'ChatCompletionReasoningItem':UserWarning
